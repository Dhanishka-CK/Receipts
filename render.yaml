services:
  - type: web
    name: receipts-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn receipts.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EMBED_BACKEND
        value: fastembed
      - key: TZ
        value: Asia/Kolkata
      - key: MIN_CONFIDENCE
        value: 0.7
      - key: MAX_ALERTS_PER_HOUR
        value: 10
      - key: FORGET_MIN_SCORE
        value: 0.45
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LYZR_API_KEY
        sync: false
      - key: LYZR_EXTRACTOR_AGENT_ID
        sync: false
      - key: LYZR_AUDITOR_AGENT_ID
        sync: false
      - key: LYZR_MANAGER_AGENT_ID
        sync: false
      - key: OMI_APP_ID
        sync: false
      - key: OMI_APP_SECRET
        sync: false
